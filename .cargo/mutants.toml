# The router and client-IP integration tests need `test-utils`, and the
# E2E fault routes exist only with `e2e-faults`; without both, cargo-mutants
# ran a suite that never reached those files and every mutant in them
# survived (vauchi/private#504).
additional_cargo_args = ["--features", "test-utils,e2e-faults"]

# Skip binary entry-point functions that cannot be unit-tested:
# - main(): requires full server lifecycle (binds port, awaits shutdown signal)
# - log_startup(): an info-level log line and nothing else
# - serve(): binds the socket and exits the process when it cannot
# - shutdown_signal(): OS signal handler (SIGTERM/SIGINT)
# - init_tracing(): global subscriber init (can only be set once per process)
#
# These are matched against the full mutation description shown by `cargo mutants --list`.

exclude_re = [
    "src/main\\.rs:.* in main$",
    "src/main\\.rs:.* main with \\(\\)",
    "src/main\\.rs:.* replace log_startup",
    "src/server\\.rs:.* replace serve with",
    "src/server\\.rs:.* shutdown_signal",
    "src/main\\.rs:.* init_tracing",

    # Observability-only: the flamegraph profiler has no behavioral contract
    # to assert (like init_tracing) — mutating its setup is untestable.
    "src/flame\\.rs:",

    # SignedKeyCache::set keeps an entry only while `expires_at > now`; one
    # kept at exactly `now` is never served, because get requires
    # `now < expires_at` (vauchi/private#553).
    "src/signed_key_cache\\.rs:[0-9]+:[0-9]+: replace > with >= in SignedKeyCache::set$",

    # Time-boundary equivalents: `< ttl` vs `<= ttl` (and `< max_age` vs `<=`)
    # differ only when the elapsed duration EXACTLY equals the bound, which a
    # live monotonic clock never yields. A real boundary test needs an
    # injectable clock — tracked as PFC O1
    # (2026-07-06-ohttp-relay-pfc-violations). Re-enable once injected.
    "replace < with <= in KeyConfigCache::get",
    "replace < with <= in RateLimiter::evict_stale",

    # The E2E reorder path gives up after a fixed 15 s; whether the pending
    # entry it then drops is its own is only observable by waiting that out
    # in real time.
    "src/router\\.rs:.* replace == with != in handle_ohttp_forward",
]
